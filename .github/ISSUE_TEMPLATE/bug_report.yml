name: Bug report
description: Report a reproducible problem in Gridshift.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please use sample data. Do not include private utility records, credentials, or other sensitive information. For security issues, use the private reporting link instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps and any sample inputs needed to see the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. See …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 132 on macOS
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or details that help explain the issue. Remove sensitive information first.
    validations:
      required: false
