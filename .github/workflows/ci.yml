name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --check app.js && node --check core.js && node --check sw.js
      - run: python3 scripts/validate_pwa.py
      - run: python3 scripts/validate_release_disclosures.py
      - run: python3 scripts/verify_hand_checks.py
      - run: npm test
      - run: python3 scripts/build_pages.py
      - run: python3 scripts/validate_pages_artifact.py
